name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate workspace against schemas and the rule catalog
        run: npm run validate -- --strict
      - name: Test guardrails
        run: npm test
      - name: Export the scored run as SARIF
        run: npm run export:sarif -- --input examples/neem-square.run-1/report.json --output sample.sarif
