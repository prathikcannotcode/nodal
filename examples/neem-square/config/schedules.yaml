# Cron schedules for jobs/. Times are IST. Format: minute hour day-of-month month day-of-week.
jobs:
  purge_removed:
    run: jobs/purge_removed.py
    cron: "30 2 * * *"

  purge_closed_accounts:
    run: jobs/purge_closed_accounts.py
    cron: "0 3 * * *"

  terms_reminder:
    run: jobs/terms_reminder.py
    cron: "0 9 15 1 *"      # periodic policy reminder to all users

  compliance_report:
    run: jobs/compliance_report.py
    cron: "0 6 1 * *"

  grievance_escalation:
    run: services/grievance/intake.py:escalate_due
    cron: "*/30 * * * *"
